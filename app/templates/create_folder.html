<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart File — New Folder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1117; --bg-panel:#10161f; --text:#E6EDF3; --text-muted:#8B949E;
    --accent:#6E5BFF; --accent-dim:#6E5BFF33; --success:#3FB68B; --amber:#D89A3E; --line:#21262d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--bg);}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter', sans-serif;
    min-height:100vh; overflow-x:hidden;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  #bg-canvas{ position:fixed; inset:0; width:100vw; height:100vh; z-index:0; display:block; }
  .vignette{ position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(circle at 50% 45%, transparent 25%, rgba(13,17,23,0.7) 80%); }
  .stage{ position:relative; z-index:2; width:100%; max-width:440px; perspective:1200px; }

  .box{
    background:linear-gradient(160deg, rgba(19,26,36,0.85), rgba(13,17,23,0.72));
    border:1px solid rgba(255,255,255,0.09); border-radius:20px; padding:38px 34px;
    backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
    transform-style:preserve-3d; transition:transform .2s ease;
    animation:cardIn 1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn{ from{opacity:0; transform:translateY(36px) rotateX(12deg);} to{opacity:1; transform:none;} }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--accent); letter-spacing:0.14em; margin-bottom:10px; }
  h1{ font-family:'Space Grotesk', sans-serif; font-size:26px; font-weight:600; letter-spacing:-0.02em; margin-bottom:26px; }
  label{ font-size:12.5px; color:var(--text-muted); display:block; margin-bottom:8px; font-weight:500; }
  input[type="text"]{
    width:100%; padding:13px 15px; background:rgba(9,13,20,0.75); border:1px solid var(--line);
    border-radius:10px; color:var(--text); margin-bottom:18px; font-size:14.5px; font-family:'Inter', sans-serif;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type="text"]::placeholder{ color:#4d5561; }
  input[type="text"]:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-dim); }
  button{
    width:100%; padding:14px; background:linear-gradient(135deg, #7d6bff, #5c4ce0); color:#fff; border:none;
    border-radius:10px; font-weight:600; font-size:15px; cursor:pointer;
    box-shadow:0 10px 30px rgba(110,91,255,0.4); transition:transform .12s ease, box-shadow .2s ease;
  }
  button:hover{ transform:translateY(-2px); box-shadow:0 14px 40px rgba(110,91,255,0.55); }
  .back{ color:var(--text-muted); display:block; margin-top:18px; text-align:center; font-size:13px; text-decoration:none; }
  .back:hover{ color:var(--text); }
</style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="vignette"></div>

  <div class="stage">
    <div class="box" id="tilt">
      <div class="eyebrow">ORGANIZE</div>
      <h1>Create a new folder</h1>
      <form method="POST">
        <label for="name">Folder name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Assignment 1" required>
        <button type="submit">Create folder</button>
      </form>
      <a class="back" href="{{ url_for('main.dashboard') }}">← Back to dashboard</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="{{ url_for('static', filename='js/scene.js') }}"></script>
  <script>
    if (window.SmartFileScene) SmartFileScene.mount('#bg-canvas', { density: 11 });
    var tilt = document.getElementById('tilt');
    if (tilt && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      tilt.addEventListener('mousemove', function (e) {
        var r = tilt.getBoundingClientRect();
        var rx = ((e.clientY - r.top) / r.height - 0.5) * -6;
        var ry = ((e.clientX - r.left) / r.width - 0.5) * 6;
        tilt.style.transform = 'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
      });
      tilt.addEventListener('mouseleave', function () { tilt.style.transform = ''; });
    }
  </script>
</body>
</html>
