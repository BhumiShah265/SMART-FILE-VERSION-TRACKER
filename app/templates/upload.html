<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart File — Upload</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body{
    background:#0D1117;
    color:#E6EDF3;
    font-family:sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }
  .box{
    background:#131a24;
    border:1px solid #21262d;
    border-radius:10px;
    padding:32px;
    width:100%;
    max-width:400px;
  }
  h1{ font-size:22px; margin-bottom:20px; }
  input[type="file"]{
    width:100%;
    padding:10px;
    background:#0D1117;
    border:1px solid #21262d;
    border-radius:6px;
    color:#E6EDF3;
    margin-bottom:16px;
  }
  button{
    width:100%;
    padding:12px;
    background:#6E5BFF;
    color:#fff;
    border:none;
    border-radius:6px;
    font-weight:600;
    cursor:pointer;
  }
  button:hover{ background:#5c4ce0; }
  a{ color:#8B949E; display:block; margin-top:16px; text-align:center; font-size:13px; }
</style>
</head>
<body>
  <div class="box">
    <h1>Upload a file to track</h1>
    <form method="POST" enctype="multipart/form-data">
      <input type="file" name="file" required>
      <button type="submit">Upload</button>
    </form>
    <a href="{{ url_for('main.dashboard') }}">← Back to dashboard</a>
  </div>
</body>
</html>
