{% extends 'layout.html' %}
{% block content %}
<div class="mb-10 flex justify-between items-end">
    <div>
        <p class="text-[10px] text-cyan-500 mb-2 font-mono tracking-widest">— SEMANTIC COMPARISON ENGINE</p>
        <h2 class="text-4xl font-black tracking-tighter uppercase text-white">Version <span class="text-cyan-500">Delta</span></h2>
    </div>
    <a href="{{ url_for('dashboard') }}" class="text-[10px] font-bold border border-slate-700 px-6 py-3 rounded hover:bg-white hover:text-black transition tracking-widest">
        RETURN TO VAULT
    </a>
</div>

<div class="card-glass p-2 rounded-xl overflow-hidden border border-slate-800 shadow-2xl">
    <style>
        /* Styling the raw Python HtmlDiff output */
        table.diff { 
            width: 100%; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 12px; 
            border-collapse: collapse; 
            background: transparent !important;
            color: #94a3b8 !important;
        }
        .diff_header { 
            background-color: #0f172a !important; 
            color: #475569 !important; 
            font-weight: bold; 
            padding: 8px 12px; 
            text-align: right; 
            width: 50px;
            border-right: 1px solid #1e293b;
        }
        td { padding: 4px 12px; border: none; }
        
        /* The "Smart" Highlights */
        .diff_add { background-color: rgba(6, 182, 212, 0.15) !important; color: #22d3ee !important; }
        .diff_chg { background-color: rgba(234, 179, 8, 0.1) !important; color: #facc15 !important; }
        .diff_sub { background-color: rgba(239, 68, 68, 0.15) !important; color: #f87171 !important; }
        
        .diff_next { display: none; } /* Hide the 'next' navigation generated by difflib */
        
        /* Line Numbers Styling */
        table.diff thead tr:first-child {
            background-color: #1e293b;
            color: #94a3b8;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.1em;
        }
    </style>
    
    <div class="overflow-x-auto">
        {{ diff_table|safe }}
    </div>
</div>

<div class="mt-6 flex gap-6 text-[10px] font-mono uppercase tracking-widest text-slate-500">
    <div class="flex items-center gap-2"><span class="w-3 h-3 bg-cyan-500/20 border border-cyan-500/40 block"></span> Added</div>
    <div class="flex items-center gap-2"><span class="w-3 h-3 bg-red-500/20 border border-red-500/40 block"></span> Removed</div>
    <div class="flex items-center gap-2"><span class="w-3 h-3 bg-yellow-500/10 border border-yellow-500/30 block"></span> Modified</div>
</div>
{% endblock %}
